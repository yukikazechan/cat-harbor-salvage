<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10191f"><title>深海开箱 · 猫港打捞局</title><style>
*{box-sizing:border-box}body{margin:0;background:#091116;color:#e3edf1;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;background-image:radial-gradient(ellipse at 50% 20%,#23343d 0,transparent 65%)}button{font:inherit;cursor:pointer;border:0}main{max-width:760px;margin:auto;padding:22px 18px 30px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:3px;color:#f5be57}h1{font-size:28px;margin:7px 0 4px;letter-spacing:2px}.sub{color:#8397a3;font-size:12px;line-height:1.7}.sound{color:#b8c7cc;background:#25333c;border:1px solid #45515a;padding:9px;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}.stat{padding:13px;background:#152229;border:1px solid #30414b;border-radius:9px}.stat small{color:#9dafb7;font-size:11px;letter-spacing:1px}.stat strong{display:block;font-size:clamp(16px,4.8vw,25px);font-variant-numeric:tabular-nums;margin-top:6px}.profit{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(110deg,#162c28,#152229)}.profit strong{margin:0;color:#5dd6a2}.profit.win{background:linear-gradient(110deg,#432d1d,#241d1c)}.profit.win strong{color:#ffce63}.port{display:flex;justify-content:space-between;margin-bottom:8px;font-size:11px;color:#b6c6cd;gap:10px}.stage{position:relative;border:8px solid #26343b;border-radius:8px;box-shadow:0 15px 60px #0008,inset 0 0 0 2px #79858a;overflow:hidden;background:#080f13;aspect-ratio:1}canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none}.burst{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,#ffbe5866,transparent 70%);opacity:0}.notice{min-height:46px;text-align:center;padding:12px 0 7px;color:#c3d4dd;font-size:13px}.progress{height:4px;background:#28383f;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#e8b353;width:0;transition:width .3s}.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1;padding:14px 8px;border-radius:8px;font-weight:750;color:#172026;background:linear-gradient(#ffdd88,#e8af49);box-shadow:0 3px 0 #875f29}.actions button:disabled{background:#26353d;color:#718790;box-shadow:none;cursor:not-allowed}.log{margin-top:20px;border-top:1px solid #2a3c46;padding-top:14px}.loghead{display:flex;justify-content:space-between;color:#8da5b3;font-size:12px}.items{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;min-height:36px}.chip{padding:6px 9px;border:1px solid #354750;background:#18262f;border-radius:5px;font-size:11px}.chip.red{color:#ffc286;border-color:#cf5b37;background:#47201c}.tip{text-align:center;color:#6f8794;font-size:11px;line-height:1.8;margin-top:18px}.overlay{position:fixed;inset:0;z-index:5;background:#060e16cf;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}.overlay[hidden]{display:none}.modal{max-width:420px;width:100%;padding:28px;background:linear-gradient(145deg,#2f3029,#16242d);border:1px solid #b88a46;border-radius:14px;text-align:center;box-shadow:0 0 70px #d5a12c22}.modal h2{color:#ffd077;margin:8px}.modal p{color:#bac8cc;line-height:1.8}.modal strong{font-size:30px;color:#ffd077}.modal button{padding:14px 25px;background:#f5c368;border-radius:8px;font-weight:bold;width:100%;margin-top:18px}.seal{font-size:40px} @media(max-width:420px){main{padding:14px 12px}h1{font-size:24px}.stats{margin-top:13px}.stat{padding:10px}.stage{border-width:6px}}
</style></head><body><main><header class="top"><div><div class="brand">CAT HARBOR / SALVAGE DIVISION</div><h1>深海开箱 · 猫港打捞局</h1><div class="sub">切开未知，打捞命运。最后一刀，价值连城。</div></div><button class="sound" id="sound" aria-label="开启或关闭音效">🔊 音效</button></header><section class="stats" aria-label="本箱收益"><div class="stat"><small>集装箱购买成本</small><strong id="cost">¥0</strong></div><div class="stat"><small>已打捞 · 当前市价</small><strong id="value">¥0</strong></div><div class="stat profit" id="profitBox"><small>当前利润 / NET PROFIT</small><strong id="profit">¥0</strong></div></section><div class="port"><span id="port"></span><span id="count">0 / 0 已开</span></div><div class="stage" id="stage"><canvas id="game" aria-label="6乘6打捞网格。点击或按住拖动切割金属板。" tabindex="0"></canvas><div class="burst" id="burst"></div></div><div class="notice" id="notice" role="status">点击敲击 / 按住拖动切割 · 大红封板最后解锁</div><div class="progress"><i id="progress"></i></div><div class="actions"><button id="settle" disabled>一键结算</button><button id="again" disabled>再来一箱</button></div><section class="log"><div class="loghead"><span>打捞清单 / MANIFEST</span><span id="total">等待切割…</span></div><div class="items" id="items"></div></section><footer class="tip">剧情爽玩模式 · 每箱必含传世大红 · 无充值、无真实交易<br>点击可敲击切割，按住拖动更快；键盘方向键选板，空格切割。</footer></main><div class="overlay" id="overlay" hidden><div class="modal"><div class="seal">⚓</div><h2>本航次 · 满载而归</h2><p id="summary"></p><strong id="result"></strong><p id="record"></p><button id="modalAgain">再来一箱 →</button></div></div><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const ports=[{name:'上海 · 洋山港',type:'失联远洋箱',cost:6870000},{name:'鹿特丹 · 深水港',type:'封存收藏箱',cost:8250000},{name:'新加坡 · 自由港',type:'新能源特货箱',cost:5430000},{name:'迪拜 · 杰贝阿里港',type:'私人拍卖箱',cost:9720000}];
const catalog={junk:[['破烂废铁','⚙',180],['旧轮胎','◉',320],['空矿泉水瓶','♧',12]],mid:[['二手显卡','▣',2800],['窖藏名酒','♜',18000]],gold:[['大金条','▰',980000],['劳力士','◷',168000],['航拍无人机','✣',56000]],red:[['新能源动力电池组','▥',32600000],['传国玉玺','玺',58600000],['绝版超跑引擎','⚙',45200000]]};
let items=[],particles=[],plates=[],portIndex=-1,cost=0,value=0,shown=0,opened=0,redItem=null,shake=0,flash=0,last=0,selected=0,settled=false,completed=false,totalProfit=0,round=0,audio=null,muted=false,pointer={down:false,x:0,y:0},sparkTimer=0;
const money=n=>(n<0?'-':'')+'¥'+Math.round(Math.abs(n)).toLocaleString('en-US');
const random=a=>a[Math.floor(Math.random()*a.length)];
function sound(kind){if(muted||!audio)return;const t=audio.currentTime;const out=audio.createGain();out.connect(audio.destination);out.gain.value=.19;if(kind==='spark'||kind==='hit'){const length=kind==='spark'?.12:.28,buf=audio.createBuffer(1,Math.ceil(audio.sampleRate*length),audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.025));const src=audio.createBufferSource(),filter=audio.createBiquadFilter();src.buffer=buf;filter.type=kind==='spark'?'highpass':'lowpass';filter.frequency.value=kind==='spark'?1800:550;src.connect(filter);filter.connect(out);src.start(t);src.onended=()=>out.disconnect();if(kind==='spark')return;}
const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(out);let duration=.35;if(kind==='red'){duration=1.6;osc.type='sawtooth';osc.frequency.setValueAtTime(165,t);osc.frequency.exponentialRampToValueAtTime(32,t+1.3);gain.gain.setValueAtTime(.7,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);}else{osc.type=kind==='coin'?'sine':'triangle';osc.frequency.setValueAtTime(kind==='coin'?880:140,t);osc.frequency.exponentialRampToValueAtTime(kind==='coin'?1760:40,t+.2);gain.gain.setValueAtTime(.6,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);}osc.start(t);osc.stop(t+duration);osc.onended=()=>out.disconnect();}
function unlockAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch{}}
function newBox(){portIndex=(portIndex+1)%ports.length;const p=ports[portIndex];cost=p.cost;value=shown=opened=0;items=[];plates=[];particles=[];selected=0;pointer.down=false;settled=completed=false;shake=flash=0;round++;$('overlay').hidden=true;$('items').innerHTML='';$('cost').textContent=money(cost);$('port').textContent=p.name+' / '+p.type+' #'+String(round).padStart(3,'0');$('settle').disabled=$('again').disabled=true;$('notice').textContent='先切小板寻找宝物 · 红色警示封板最后解锁';
const grid=Array.from({length:6},()=>Array(6).fill(false));
function fits(x,y,w,h){return x+w<=6&&y+h<=6&&Array.from({length:h},(_,j)=>Array.from({length:w},(_,i)=>!grid[y+j][x+i]).every(Boolean)).every(Boolean);}
function add(x,y,w,h,tier,data){if(!fits(x,y,w,h))throw Error('Invalid packing');for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]=true;const item={x,y,w,h,tier,name:data[0],icon:data[1],price:data[2],progress:0,open:false,seed:Math.random()*100,need: .40+w*h*.11};items.push(item);return item;}
const rdata=catalog.red[portIndex%3],rw=portIndex%2?2:3,rh=3;redItem=add(Math.random()<.5?0:6-rw,Math.random()<.5?0:3,rw,rh,'red',rdata);
for(let n=0;n<3;n++){const spaces=[];for(let y=0;y<5;y++)for(let x=0;x<5;x++)if(fits(x,y,2,2))spaces.push([x,y]);if(spaces.length){const [x,y]=random(spaces);add(x,y,2,2,'gold',catalog.gold[n]);}}
for(let n=0;n<5;n++){const spaces=[];for(let y=0;y<6;y++)for(let x=0;x<6;x++)for(const [w,h]of [[1,2],[2,1]])if(fits(x,y,w,h))spaces.push([x,y,w,h]);if(spaces.length)add(...random(spaces),'mid',random(catalog.mid));}
for(let y=0;y<6;y++)for(let x=0;x<6;x++)if(!grid[y][x])add(x,y,1,1,'junk',random(catalog.junk));updateUI();}
function updateUI(){ $('count').textContent=opened+' / '+items.length+' 已开';$('total').textContent=opened?'已入库 '+opened+' 件':'等待切割…';$('progress').style.width=(opened/items.length*100)+'%';}
function sparks(x,y,n,color){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*240;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:.3+Math.random()*.65,max:1,color:color||random(['#fff7bb','#ffd24a','#ff942b']),size:1+Math.random()*3});}if(particles.length>1100)particles.splice(0,particles.length-1100);}
function reveal(it){if(it.open)return;it.open=true;opened++;value+=it.price;plates.push({item:it,t:0,vx:(Math.random()-.5)*100,vy:-140,angle:0,spin:(Math.random()-.5)*3});const chip=document.createElement('span');chip.className='chip '+it.tier;chip.textContent=it.icon+' '+it.name+' · '+money(it.price);$('items').prepend(chip);sound('hit');sound(it.tier==='red'?'red':'coin');if(it.tier==='red'){shake=1.7;flash=1.5;for(let i=0;i<12;i++)sparks(it.x*100+it.w*50,it.y*100+it.h*50,55,random(['#ff423a','#ffcc59','#fff3b0']));$('notice').textContent='传世大红！'+it.name+' · '+money(it.price);}else{$('notice').textContent='打捞成功：'+it.name+' · '+money(it.price);sparks(it.x*100+it.w*50,it.y*100+it.h*50,30);}
if(opened===items.length-1){$('notice').textContent='最后一道封印已解锁！切开大板，见证翻盘。';sound('coin');}if(opened===items.length){completed=true;$('settle').disabled=$('again').disabled=false;$('notice').textContent='满箱打捞完毕！点击结算，领取本航次战报。';}updateUI();}
function cut(it,amount,x,y){if(!it||it.open)return;if(it.tier==='red'&&opened<items.length-1){$('notice').textContent='⚠ 传世货物保险封板：先打捞其他 '+(items.length-1-opened)+' 件';return;}it.progress=Math.min(1,it.progress+amount/it.need);sparks(x,y,6);const side=Math.floor(Math.random()*4);sparks(side<2?(side?it.x*100+it.w*100:it.x*100):it.x*100+Math.random()*it.w*100,side>=2?(side===2?it.y*100:it.y*100+it.h*100):it.y*100+Math.random()*it.h*100,3);if(it.progress>=1)reveal(it);}
function itemAt(x,y){return items.find(it=>x>=it.x*100&&x<(it.x+it.w)*100&&y>=it.y*100&&y<(it.y+it.h)*100);}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*600};}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();unlockAudio();Object.assign(pointer,point(e),{down:true});canvas.setPointerCapture(e.pointerId);const it=itemAt(pointer.x,pointer.y);if(it)selected=items.indexOf(it);cut(it,.24,pointer.x,pointer.y);sound('spark');});
canvas.addEventListener('pointermove',e=>Object.assign(pointer,point(e)));for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer.down=false);
window.addEventListener('blur',()=>pointer.down=false);document.addEventListener('visibilitychange',()=>{pointer.down=false;last=0;});
canvas.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp',' '].includes(e.key)){e.preventDefault();unlockAudio();if(e.key===' '){const it=items[selected];cut(it,.28,it.x*100+it.w*50,it.y*100+it.h*50);sound('spark');}else selected=(selected+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+items.length)%items.length;}});
$('sound').onclick=()=>{unlockAudio();muted=!muted;$('sound').textContent=muted?'🔇 静音':'🔊 音效';};
function settle(){if(!completed)return;if(!settled){totalProfit+=value-cost;settled=true;}$('summary').textContent=ports[portIndex].name+' · '+opened+' 件藏品全部入库。购入 '+money(cost)+'，市价 '+money(value)+'。';$('result').textContent='净赚 '+money(value-cost);$('record').textContent='本次会话累计利润 '+money(totalProfit);$('overlay').hidden=false;}
$('settle').onclick=()=>{unlockAudio();settle();};function next(){if(!completed)return;settle();newBox();}$('again').onclick=$('modalAgain').onclick=()=>{unlockAudio();next();};
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}
function drawPlate(it,fall=false){const x=it.x*100+4,y=it.y*100+4,w=it.w*100-8,h=it.h*100-8;const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#697780');g.addColorStop(.24,'#3a4851');g.addColorStop(.5,'#5a6870');g.addColorStop(1,'#26333d');rect(x,y,w,h,g);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle='#c2d0d018';ctx.lineWidth=1;for(let i=3;i<h;i+=4){ctx.beginPath();ctx.moveTo(x,y+i);ctx.lineTo(x+w,y+i+2);ctx.stroke();}ctx.restore();ctx.strokeStyle='#a3b2b750';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,w-4,h-4);for(const dx of [9,w-9])for(const dy of [9,h-9]){ctx.fillStyle='#1b262e';ctx.beginPath();ctx.arc(x+dx,y+dy,3,0,7);ctx.fill();}ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=it.tier==='red'?'#eabc78':'#b8c6cc88';ctx.font=(it.tier==='red'?42:Math.min(w,h)*.3)+'px sans-serif';ctx.fillText(it.tier==='red'?'⚠':'ฅ',x+w/2,y+h/2-8);ctx.font='10px sans-serif';ctx.fillText(it.tier==='red'?(opened<items.length-1?'保险封板 · 待解锁':'封印解除 · 最后一刀'):'CAT HARBOR · '+it.w+'×'+it.h,x+w/2,y+h/2+23);if(it.progress>0){ctx.strokeStyle='#ffdf7d';ctx.shadowColor='#ffad28';ctx.shadowBlur=12;ctx.lineWidth=3;ctx.beginPath();let remaining=it.progress*2*(w+h),px=x+4,py=y+4;ctx.moveTo(px,py);for(const [dx,dy,len]of [[1,0,w-8],[0,1,h-8],[-1,0,w-8],[0,-1,h-8]]){let d=Math.min(remaining,len);px+=dx*d;py+=dy*d;ctx.lineTo(px,py);remaining-=d;if(remaining<=0)break;}ctx.stroke();ctx.shadowBlur=0;}if(!fall&&selected===items.indexOf(it)&&document.activeElement===canvas){ctx.strokeStyle='#fbd077';ctx.strokeRect(x+4,y+4,w-8,h-8);}}
function drawItem(it,t){const x=it.x*100+4,y=it.y*100+4,w=it.w*100-8,h=it.h*100-8;let color=it.tier==='red'?'#602821':it.tier==='gold'?'#4d3e21':it.tier==='mid'?'#1e3d4f':'#233238';rect(x,y,w,h,color);ctx.strokeStyle=it.tier==='red'?'#ff9d53':it.tier==='gold'?'#e2b95b':'#648594';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,w-6,h-6);ctx.textAlign='center';ctx.textBaseline='middle';if(it.tier==='red'){ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(t*.0003);for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);const grad=ctx.createLinearGradient(0,0,0,-h);grad.addColorStop(0,'#ffcf6344');grad.addColorStop(1,'#ff9b0000');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-12,-h);ctx.lineTo(12,-h);ctx.fill();}ctx.restore();}ctx.fillStyle=it.tier==='red'?'#ffe19c':it.tier==='gold'?'#ffdd79':'#c6d6dc';ctx.font=Math.min(w,h)*.37+'px sans-serif';ctx.fillText(it.icon,x+w/2,y+h/2-15);ctx.font='bold '+(w>130?16:11)+'px sans-serif';ctx.fillText(it.name,x+w/2,y+h/2+20);ctx.font=(w>130?14:10)+'px sans-serif';ctx.fillText(money(it.price),x+w/2,y+h/2+39);}
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(600*dpr);canvas.height=Math.round(600*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}window.addEventListener('resize',resize);
function frame(t){const dt=last?Math.min((t-last)/1000,.04):.016;last=t;shown+=(value-shown)*(1-Math.exp(-dt*5));if(Math.abs(value-shown)<1)shown=value;$('value').textContent=money(shown);$('profit').textContent=money(shown-cost);$('profitBox').classList.toggle('win',shown>=cost);if(pointer.down){const it=itemAt(pointer.x,pointer.y);cut(it,dt*.92,pointer.x,pointer.y);sparkTimer+=dt;if(sparkTimer>.085){sparkTimer=0;if(it&&!it.open&&!(it.tier==='red'&&opened<items.length-1))sound('spark');}}
shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);document.querySelector('main').style.transform=shake?'translate('+((Math.random()-.5)*shake*7)+'px,'+((Math.random()-.5)*shake*7)+'px)':'';$('burst').style.opacity=Math.min(flash*.5,.6);ctx.clearRect(0,0,600,600);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake*12,(Math.random()-.5)*shake*12);rect(0,0,600,600,'#0e181e');for(const it of items){if(it.open)drawItem(it,t);else drawPlate(it);}for(const p of plates){p.t+=dt;p.vy+=620*dt;p.angle+=p.spin*dt;const it=p.item;ctx.save();ctx.globalAlpha=Math.max(0,1-p.t/1.1);ctx.translate(it.x*100+it.w*50+p.vx*p.t,it.y*100+it.h*50+p.vy*p.t);ctx.rotate(p.angle);ctx.translate(-(it.x*100+it.w*50),-(it.y*100+it.h*50));drawPlate(it,true);ctx.restore();}plates=plates.filter(p=>p.t<1.1);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.024,p.y-p.vy*.024);ctx.stroke();}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0&&p.y<900);ctx.restore();requestAnimationFrame(frame);}
resize();newBox();requestAnimationFrame(frame);
</script></body></html>
